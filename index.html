<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --text: #111827;
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.28);
      --btn-bg: rgba(255, 255, 255, 0.2);
      --btn-bg-hover: rgba(255, 255, 255, 0.3);
      --input-bg: rgba(255, 255, 255, 0.22);
      --control-text: #111827;
      --control-border: rgba(17, 24, 39, 0.2);
      --gradient: linear-gradient(130deg, #d6c8ff, #b8e5ff, #ffd6e7, #d2f5dc);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--gradient);
      background-size: 250% 250%;
      animation: drift 14s ease-in-out infinite;
      overflow: hidden;
      transition: background 350ms ease;
    }

    body.night {
      --text: #e9efff;
      --glass-bg: rgba(20, 28, 54, 0.35);
      --glass-border: rgba(194, 214, 255, 0.26);
      --btn-bg: rgba(143, 170, 236, 0.2);
      --btn-bg-hover: rgba(143, 170, 236, 0.35);
      --input-bg: rgba(120, 145, 210, 0.22);
      --control-text: #ffffff;
      --control-border: rgba(255, 255, 255, 0.35);
      --gradient: linear-gradient(130deg, #1c2344, #263560, #162947, #3d2d5b);
    }

    @keyframes drift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .card {
      width: min(94vw, 560px);
      border-radius: 24px;
      padding: 2rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(20, 20, 40, 0.25);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .time {
      margin: 0.3rem 0 1.3rem;
      font-size: clamp(2.8rem, 10vw, 4.2rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1px;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .setup {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .setup label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .setup input,
    .setup select {
      width: 4.2rem;
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      color: var(--control-text);
      background: var(--input-bg);
      outline: none;
      text-align: center;
    }

    .setup select {
      width: 10.8rem;
      text-align: left;
      cursor: pointer;
    }

    .setup input::placeholder,
    .setup select::placeholder {
      color: color-mix(in srgb, var(--control-text) 60%, transparent);
    }

    .soundbar {
      margin: 0.9rem 0 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .soundbar label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .soundbar input[type="range"] {
      width: 8.5rem;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .clock-alarm {
      margin: 0 0 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .clock-alarm label {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .clock-alarm input,
    .clock-alarm select {
      width: 4.2rem;
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 0.5rem 0.75rem;
      color: var(--control-text);
      background: var(--input-bg);
      outline: none;
      text-align: center;
    }

    .clock-alarm select {
      width: 4.8rem;
      cursor: pointer;
    }

    .bg-audio-frame {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: 0;
      z-index: -1;
    }

    .flashlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.05) 65%);
      transition: opacity 120ms ease;
      z-index: 3;
    }

    .flashlight.active {
      animation: flashPulse 300ms ease-in-out 8;
    }

    @keyframes flashPulse {
      0% {
        opacity: 0;
      }
      45% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    button {
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 0.7rem 1.1rem;
      color: var(--control-text);
      background: var(--btn-bg);
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, transform 120ms ease;
    }

    .btn-primary {
      background: rgba(77, 184, 128, 0.72);
      border-color: rgba(255, 255, 255, 0.56);
      color: var(--control-text);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: rgba(255, 104, 104, 0.68);
      border-color: rgba(255, 255, 255, 0.56);
      color: var(--control-text);
    }

    .btn-alert {
      background: rgba(255, 193, 92, 0.78);
      color: var(--control-text);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .btn-primary:hover,
    .btn-secondary:hover,
    .btn-danger:hover,
    .btn-alert:hover {
      filter: brightness(1.08);
    }

    button:hover {
      background: var(--btn-bg-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 5;
      width: 4.4rem;
      height: 2.35rem;
      padding: 0.18rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid var(--control-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(20, 20, 40, 0.16);
    }

    .theme-toggle .toggle-thumb {
      width: 1.95rem;
      height: 1.95rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #111827;
      background: rgba(255, 255, 255, 0.88);
      transition: transform 200ms ease, background 200ms ease;
    }

    body.night .theme-toggle {
      justify-content: flex-start;
      background: rgba(20, 28, 54, 0.45);
    }

    body.night .theme-toggle .toggle-thumb {
      transform: translateX(2rem);
      color: #f7f8ff;
      background: rgba(40, 53, 99, 0.94);
    }

    .hint {
      margin-top: 1.2rem;
      opacity: 0.88;
      font-size: 0.9rem;
    }

    .tool-tabs {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tool-tab.active {
      background: rgba(255, 255, 255, 0.45);
      color: #1d2440;
    }

    body.night .tool-tab.active {
      color: #f4f7ff;
      background: rgba(143, 170, 236, 0.45);
    }

    .tool-section {
      display: none;
    }

    .tool-section.active {
      display: block;
    }

    .section-title {
      margin: 0.25rem 0 0.85rem;
      font-size: 1rem;
      opacity: 0.92;
    }

    .alarm-list {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }

    .timer-list {
      display: grid;
      gap: 0.55rem;
      margin: 0.8rem 0 1rem;
    }

    .alarm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    .alarm-item span {
      font-weight: 700;
    }

    .timer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    .timer-item.active {
      border-color: rgba(255, 255, 255, 0.58);
      background: rgba(255, 255, 255, 0.23);
    }

    .timer-item span {
      font-weight: 700;
    }

    .icon-btn {
      width: 2.4rem;
      height: 2.4rem;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .stopwatch-time {
      margin: 0.6rem 0 1.1rem;
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="night">
  <div class="flashlight" id="flashlight" aria-hidden="true"></div>
  <button id="themeBtn" class="theme-toggle" type="button" aria-label="Switch to day mode" aria-pressed="true">
    <span class="toggle-thumb" id="themeIcon">☾</span>
  </button>
  <main class="card">
    <h1>Pomodoro Tools</h1>
    <div class="tool-tabs">
      <button id="alarmTabBtn" class="tool-tab active">Alarm</button>
      <button id="stopwatchTabBtn" class="tool-tab">Stopwatch</button>
      <button id="timerTabBtn" class="tool-tab">Timer</button>
    </div>

    <section id="alarmSection" class="tool-section active">
      <h2 class="section-title">Alarm</h2>
      <div class="setup">
        <select id="ringtoneSelect" aria-label="Alarm ringtone">
          <option value="radar">Radar</option>
          <option value="seaside">By the Seaside</option>
          <option value="chime">Classic Chime</option>
        </select>
        <label for="alarmDurationInput">Alarm s</label>
        <input id="alarmDurationInput" type="number" min="5" max="600" value="30" />
      </div>
      <div class="soundbar">
        <label for="bgSoundSelect">Background</label>
        <select id="bgSoundSelect" aria-label="Background sound">
          <option value="lofi">Lofi Beats</option>
          <option value="rain">Ambient Rain</option>
        </select>
        <label for="volumeSlider">Volume</label>
        <input id="volumeSlider" type="range" min="0" max="100" value="35" />
      </div>
      <div class="clock-alarm">
        <label for="clockHourInput">Alarm At</label>
        <input id="clockHourInput" type="number" min="1" max="12" value="5" aria-label="Alarm hour" />
        <span>:</span>
        <input id="clockMinuteInput" type="number" min="0" max="59" value="00" aria-label="Alarm minute" />
        <select id="clockPeriodSelect" aria-label="AM or PM">
          <option value="AM">AM</option>
          <option value="PM">PM</option>
        </select>
        <button id="addClockAlarmBtn" class="btn-alert icon-btn" title="Add alarm">+</button>
        <button id="setClockAlarmBtn" class="btn-alert">Save Alarm</button>
        <button id="clearClockAlarmBtn" class="btn-secondary">Clear All</button>
      </div>
      <div id="alarmList" class="alarm-list" aria-live="polite"></div>
      <div class="controls">
        <button id="dingBtn" class="btn-danger">Test Alarm</button>
      </div>
      <p class="hint" id="alarmHint">No alarms set</p>
    </section>

    <section id="stopwatchSection" class="tool-section">
      <h2 class="section-title">Stopwatch</h2>
      <p class="stopwatch-time" id="stopwatchTime" aria-live="polite">00:00:00.0</p>
      <div class="controls">
        <button id="startStopwatchBtn" class="btn-primary">Start Stopwatch</button>
        <button id="pauseStopwatchBtn" class="btn-secondary">Pause Stopwatch</button>
        <button id="resetStopwatchBtn" class="btn-secondary">Reset Stopwatch</button>
      </div>
    </section>

    <section id="timerSection" class="tool-section">
      <h2 class="section-title">Timer</h2>
      <div class="setup">
        <label for="hoursInput">H</label>
        <input id="hoursInput" type="number" min="0" max="23" value="0" />
        <label for="minutesInput">M</label>
        <input id="minutesInput" type="number" min="0" max="59" value="25" />
        <label for="secondsInput">S</label>
        <input id="secondsInput" type="number" min="0" max="59" value="0" />
        <button id="addTimerBtn" class="btn-alert icon-btn" title="Add timer">+</button>
        <button id="applyBtn">Save Timer</button>
      </div>
      <div id="timerList" class="timer-list" aria-live="polite"></div>
      <p class="time" id="time" aria-live="polite">00:25:00</p>
      <div class="controls">
        <button id="startBtn" class="btn-primary">Start Timer</button>
        <button id="pauseBtn" class="btn-secondary">Pause Timer</button>
        <button id="resetBtn" class="btn-secondary">Reset Timer</button>
      </div>
      <p class="hint" id="hint">Session length: 0h 25m 0s</p>
    </section>
  </main>
  <iframe
    id="bgAudioFrame"
    class="bg-audio-frame"
    title="Background audio player"
    allow="autoplay"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const DEFAULT_DURATION = { hours: 0, minutes: 25, seconds: 0 };
    let selectedDuration = { ...DEFAULT_DURATION };
    let remaining = toTotalSeconds(selectedDuration);
    let isNight = true;
    let intervalId = null;
    let flashTimeoutId = null;
    let alarmIntervalId = null;
    let alarmStopTimeoutId = null;
    let clockCheckIntervalId = null;
    let clockAlarms = [];
    let editingAlarmId = null;
    let lastClockAlarmKey = "";
    let stopwatchIntervalId = null;
    let stopwatchStartedAt = 0;
    let stopwatchElapsed = 0;
    let audioCtx = null;
    let timers = [];
    let selectedTimerId = null;
    let editingTimerId = null;
    let alarmDurationSeconds = 30;
    const alarmTabBtn = document.getElementById("alarmTabBtn");
    const stopwatchTabBtn = document.getElementById("stopwatchTabBtn");
    const timerTabBtn = document.getElementById("timerTabBtn");
    const alarmSection = document.getElementById("alarmSection");
    const stopwatchSection = document.getElementById("stopwatchSection");
    const timerSection = document.getElementById("timerSection");
    const flashlightEl = document.getElementById("flashlight");
    const timeEl = document.getElementById("time");
    const hintEl = document.getElementById("hint");
    const alarmHint = document.getElementById("alarmHint");
    const alarmDurationInput = document.getElementById("alarmDurationInput");
    const hoursInput = document.getElementById("hoursInput");
    const minutesInput = document.getElementById("minutesInput");
    const secondsInput = document.getElementById("secondsInput");
    const addTimerBtn = document.getElementById("addTimerBtn");
    const timerList = document.getElementById("timerList");
    const ringtoneSelect = document.getElementById("ringtoneSelect");
    const bgSoundSelect = document.getElementById("bgSoundSelect");
    const volumeSlider = document.getElementById("volumeSlider");
    const clockHourInput = document.getElementById("clockHourInput");
    const clockMinuteInput = document.getElementById("clockMinuteInput");
    const clockPeriodSelect = document.getElementById("clockPeriodSelect");
    const addClockAlarmBtn = document.getElementById("addClockAlarmBtn");
    const setClockAlarmBtn = document.getElementById("setClockAlarmBtn");
    const clearClockAlarmBtn = document.getElementById("clearClockAlarmBtn");
    const alarmList = document.getElementById("alarmList");
    const stopwatchTime = document.getElementById("stopwatchTime");
    const startStopwatchBtn = document.getElementById("startStopwatchBtn");
    const pauseStopwatchBtn = document.getElementById("pauseStopwatchBtn");
    const resetStopwatchBtn = document.getElementById("resetStopwatchBtn");
    const applyBtn = document.getElementById("applyBtn");
    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const dingBtn = document.getElementById("dingBtn");
    const bgAudioFrame = document.getElementById("bgAudioFrame");
    const YT_ORIGIN = window.location.origin;
    const BG_TRACKS = {
      lofi: "jfKfPfyJRdk",
      rain: "mPZkdNFkNps"
    };

    function buildEmbedUrl(trackId) {
      const params = new URLSearchParams({
        autoplay: "0",
        controls: "0",
        loop: "1",
        playlist: trackId,
        enablejsapi: "1",
        origin: YT_ORIGIN
      });
      return `https://www.youtube.com/embed/${trackId}?${params.toString()}`;
    }

    function sendPlayerCommand(command, args = []) {
      if (!bgAudioFrame.contentWindow) {
        return;
      }
      bgAudioFrame.contentWindow.postMessage(JSON.stringify({
        event: "command",
        func: command,
        args
      }), "*");
    }

    function loadBackgroundTrack() {
      const key = bgSoundSelect.value;
      const trackId = BG_TRACKS[key] || BG_TRACKS.lofi;
      bgAudioFrame.src = buildEmbedUrl(trackId);
    }

    function setBackgroundVolume() {
      sendPlayerCommand("setVolume", [Number.parseInt(volumeSlider.value, 10) || 0]);
    }

    function startBackgroundAudio() {
      sendPlayerCommand("playVideo");
      setBackgroundVolume();
      sendPlayerCommand("unMute");
    }

    function stopBackgroundAudio() {
      sendPlayerCommand("pauseVideo");
    }

    function toTotalSeconds(duration) {
      return (duration.hours * 3600) + (duration.minutes * 60) + duration.seconds;
    }

    function formatTime(totalSeconds) {
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function updateView() {
      timeEl.textContent = formatTime(remaining);
      document.title = `${formatTime(remaining)} | Pomodoro`;
      hintEl.textContent = selectedTimerId
        ? `Selected timer: ${formatTime(toTotalSeconds(selectedDuration))}`
        : "Add or select a timer to begin.";
      alarmHint.textContent = clockAlarms.length
        ? `${clockAlarms.length} alarm${clockAlarms.length === 1 ? "" : "s"} set | Alarm duration: ${alarmDurationSeconds}s`
        : `No alarms set | Alarm duration: ${alarmDurationSeconds}s`;
    }

    function showTool(tool) {
      const sections = {
        alarm: alarmSection,
        stopwatch: stopwatchSection,
        timer: timerSection
      };
      const tabs = {
        alarm: alarmTabBtn,
        stopwatch: stopwatchTabBtn,
        timer: timerTabBtn
      };

      Object.keys(sections).forEach((key) => {
        sections[key].classList.toggle("active", key === tool);
        tabs[key].classList.toggle("active", key === tool);
      });
    }

    function stopFlashlight() {
      flashlightEl.classList.remove("active");
      clearTimeout(flashTimeoutId);
      flashTimeoutId = null;
    }

    function triggerFlashlight() {
      stopFlashlight();
      flashlightEl.classList.add("active");
      flashTimeoutId = setTimeout(() => {
        flashlightEl.classList.remove("active");
      }, 2600);
    }

    function getAudioContext() {
      if (audioCtx) {
        return audioCtx;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        return null;
      }
      audioCtx = new AudioCtx();
      return audioCtx;
    }

    function unlockAudio() {
      const ctx = getAudioContext();
      if (!ctx || ctx.state !== "suspended") {
        return;
      }
      ctx.resume();
    }

    function playRingtone() {
      const ctx = getAudioContext();
      if (!ctx) {
        return;
      }
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.connect(ctx.destination);

      const selectedTone = ringtoneSelect.value;
      const tones = {
        radar: [740, 880, 740, 988],
        seaside: [392, 440, 494, 523],
        chime: [880, 1100]
      };
      const waveMap = {
        radar: "triangle",
        seaside: "sine",
        chime: "sine"
      };
      const notes = tones[selectedTone] || tones.chime;
      const waveType = waveMap[selectedTone] || "sine";

      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const startAt = now + i * 0.14;
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startAt);
        osc.connect(gain);
        osc.start(startAt);
        osc.stop(startAt + 0.28);
      });

      gain.gain.exponentialRampToValueAtTime(0.17, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);
    }

    function stopTimer() {
      clearInterval(intervalId);
      intervalId = null;
    }

    function stopAlarmLoop() {
      clearInterval(alarmIntervalId);
      clearTimeout(alarmStopTimeoutId);
      alarmIntervalId = null;
      alarmStopTimeoutId = null;
      stopFlashlight();
      stopBackgroundAudio();
      dingBtn.textContent = "Test Alarm";
    }

    function startAlarmLoop() {
      stopAlarmLoop();
      syncAlarmDuration();
      dingBtn.textContent = "Stop Alarm";
      loadBackgroundTrack();
      triggerFlashlight();
      playRingtone();
      setTimeout(() => {
        startBackgroundAudio();
      }, 700);
      alarmIntervalId = setInterval(() => {
        triggerFlashlight();
        playRingtone();
      }, 1800);
      alarmStopTimeoutId = setTimeout(() => {
        stopAlarmLoop();
      }, Math.max(5, alarmDurationSeconds) * 1000);
    }

    function formatClockAlarm(alarm) {
      return `${alarm.hour12}:${String(alarm.minute).padStart(2, "0")} ${alarm.period}`;
    }

    function to24Hour(hour12, period) {
      if (period === "AM") {
        return hour12 === 12 ? 0 : hour12;
      }
      return hour12 === 12 ? 12 : hour12 + 12;
    }

    function syncAlarmDuration() {
      alarmDurationSeconds = parseSafeInt(alarmDurationInput.value, 5, 600, 30);
      alarmDurationInput.value = String(alarmDurationSeconds);
      updateView();
    }

    function getAlarmFromInputs() {
      unlockAudio();
      syncAlarmDuration();
      const hour12 = parseSafeInt(clockHourInput.value, 1, 12, 5);
      const minute = parseSafeInt(clockMinuteInput.value, 0, 59, 0);
      const period = clockPeriodSelect.value === "PM" ? "PM" : "AM";

      clockHourInput.value = String(hour12);
      clockMinuteInput.value = String(minute).padStart(2, "0");
      clockPeriodSelect.value = period;

      return {
        id: editingAlarmId || Date.now(),
        hour12,
        hour24: to24Hour(hour12, period),
        minute,
        period
      };
    }

    function renderAlarms() {
      alarmList.innerHTML = "";

      clockAlarms.forEach((alarm) => {
        const item = document.createElement("div");
        item.className = "alarm-item";

        const time = document.createElement("span");
        time.textContent = formatClockAlarm(alarm);

        const editBtn = document.createElement("button");
        editBtn.className = "btn-secondary icon-btn";
        editBtn.type = "button";
        editBtn.textContent = "✎";
        editBtn.setAttribute("aria-label", `Edit ${formatClockAlarm(alarm)}`);
        editBtn.title = `Edit ${formatClockAlarm(alarm)}`;
        editBtn.addEventListener("click", () => {
          editingAlarmId = alarm.id;
          clockHourInput.value = String(alarm.hour12);
          clockMinuteInput.value = String(alarm.minute).padStart(2, "0");
          clockPeriodSelect.value = alarm.period;
          setClockAlarmBtn.textContent = "Save Edit";
        });

        item.append(time, editBtn);
        alarmList.appendChild(item);
      });

      updateView();
    }

    function addClockAlarm() {
      editingAlarmId = null;
      clockAlarms.push(getAlarmFromInputs());
      lastClockAlarmKey = "";
      setClockAlarmBtn.textContent = "Save Alarm";
      renderAlarms();
    }

    function setClockAlarm() {
      const alarm = getAlarmFromInputs();

      if (editingAlarmId) {
        clockAlarms = clockAlarms.map((item) => item.id === editingAlarmId ? alarm : item);
      } else {
        clockAlarms.push(alarm);
      }

      editingAlarmId = null;
      lastClockAlarmKey = "";
      setClockAlarmBtn.textContent = "Save Alarm";
      renderAlarms();
    }

    function clearClockAlarm() {
      clockAlarms = [];
      editingAlarmId = null;
      lastClockAlarmKey = "";
      setClockAlarmBtn.textContent = "Save Alarm";
      renderAlarms();
    }

    function checkClockAlarm() {
      if (!clockAlarms.length || alarmIntervalId) {
        return;
      }

      const now = new Date();
      const currentKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}`;
      const dueAlarm = clockAlarms.find((alarm) => (
        now.getHours() === alarm.hour24 &&
        now.getMinutes() === alarm.minute
      ));

      if (dueAlarm && currentKey !== lastClockAlarmKey) {
        lastClockAlarmKey = currentKey;
        unlockAudio();
        startAlarmLoop();
      }
    }

    function formatStopwatch(ms) {
      const totalTenths = Math.floor(ms / 100);
      const tenths = totalTenths % 10;
      const totalSeconds = Math.floor(totalTenths / 10);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}.${tenths}`;
    }

    function updateStopwatch() {
      const runningElapsed = stopwatchIntervalId ? Date.now() - stopwatchStartedAt : 0;
      stopwatchTime.textContent = formatStopwatch(stopwatchElapsed + runningElapsed);
    }

    function startStopwatch() {
      if (stopwatchIntervalId) {
        return;
      }
      stopwatchStartedAt = Date.now();
      stopwatchIntervalId = setInterval(updateStopwatch, 100);
      updateStopwatch();
    }

    function pauseStopwatch() {
      if (!stopwatchIntervalId) {
        return;
      }
      stopwatchElapsed += Date.now() - stopwatchStartedAt;
      clearInterval(stopwatchIntervalId);
      stopwatchIntervalId = null;
      updateStopwatch();
    }

    function resetStopwatch() {
      clearInterval(stopwatchIntervalId);
      stopwatchIntervalId = null;
      stopwatchElapsed = 0;
      stopwatchStartedAt = 0;
      updateStopwatch();
    }

    function parseSafeInt(value, min, max, fallback) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return Math.min(max, Math.max(min, parsed));
    }

    function applyDuration() {
      const hours = parseSafeInt(hoursInput.value, 0, 23, DEFAULT_DURATION.hours);
      const minutes = parseSafeInt(minutesInput.value, 0, 59, DEFAULT_DURATION.minutes);
      const seconds = parseSafeInt(secondsInput.value, 0, 59, DEFAULT_DURATION.seconds);
      const nextDuration = { hours, minutes, seconds };
      if (toTotalSeconds(nextDuration) === 0) {
        nextDuration.seconds = 1;
      }

      selectedDuration = nextDuration;
      hoursInput.value = String(selectedDuration.hours);
      minutesInput.value = String(selectedDuration.minutes);
      secondsInput.value = String(selectedDuration.seconds);
      stopTimer();
      stopAlarmLoop();
      stopBackgroundAudio();
      remaining = toTotalSeconds(selectedDuration);
      upsertSelectedTimer();
      updateView();
    }

    function getTimerFromInputs(timerId = editingTimerId || selectedTimerId || Date.now()) {
      const hours = parseSafeInt(hoursInput.value, 0, 23, DEFAULT_DURATION.hours);
      const minutes = parseSafeInt(minutesInput.value, 0, 59, DEFAULT_DURATION.minutes);
      const seconds = parseSafeInt(secondsInput.value, 0, 59, DEFAULT_DURATION.seconds);
      const duration = { hours, minutes, seconds };
      if (toTotalSeconds(duration) === 0) {
        duration.seconds = 1;
      }

      hoursInput.value = String(duration.hours);
      minutesInput.value = String(duration.minutes);
      secondsInput.value = String(duration.seconds);

      return {
        id: timerId,
        duration,
        totalSeconds: toTotalSeconds(duration)
      };
    }

    function selectTimer(timer) {
      selectedTimerId = timer.id;
      editingTimerId = null;
      selectedDuration = { ...timer.duration };
      remaining = timer.remaining ?? timer.totalSeconds;
      hoursInput.value = String(timer.duration.hours);
      minutesInput.value = String(timer.duration.minutes);
      secondsInput.value = String(timer.duration.seconds);
      stopTimer();
      renderTimers();
      updateView();
    }

    function renderTimers() {
      timerList.innerHTML = "";

      timers.forEach((timer) => {
        const item = document.createElement("div");
        item.className = `timer-item${timer.id === selectedTimerId ? " active" : ""}`;

        const time = document.createElement("span");
        time.textContent = formatTime(timer.totalSeconds);

        const actions = document.createElement("div");

        const selectBtn = document.createElement("button");
        selectBtn.className = "btn-primary";
        selectBtn.type = "button";
        selectBtn.textContent = "Use";
        selectBtn.addEventListener("click", () => selectTimer(timer));

        const editBtn = document.createElement("button");
        editBtn.className = "btn-secondary icon-btn";
        editBtn.type = "button";
        editBtn.textContent = "✎";
        editBtn.setAttribute("aria-label", `Edit ${formatTime(timer.totalSeconds)} timer`);
        editBtn.title = `Edit ${formatTime(timer.totalSeconds)} timer`;
        editBtn.addEventListener("click", () => {
          editingTimerId = timer.id;
          selectedTimerId = timer.id;
          hoursInput.value = String(timer.duration.hours);
          minutesInput.value = String(timer.duration.minutes);
          secondsInput.value = String(timer.duration.seconds);
          applyBtn.textContent = "Save Edit";
          renderTimers();
        });

        actions.append(selectBtn, editBtn);
        item.append(time, actions);
        timerList.appendChild(item);
      });

      updateView();
    }

    function addTimer() {
      editingTimerId = null;
      const timer = getTimerFromInputs(Date.now());
      timers.push(timer);
      selectedTimerId = timer.id;
      selectedDuration = { ...timer.duration };
      remaining = timer.totalSeconds;
      applyBtn.textContent = "Save Timer";
      renderTimers();
    }

    function upsertSelectedTimer() {
      const timer = getTimerFromInputs();

      if (editingTimerId || timers.some((item) => item.id === timer.id)) {
        timers = timers.map((item) => item.id === timer.id ? timer : item);
      } else {
        timers.push(timer);
      }

      selectedTimerId = timer.id;
      editingTimerId = null;
      selectedDuration = { ...timer.duration };
      remaining = timer.totalSeconds;
      applyBtn.textContent = "Save Timer";
      renderTimers();
    }

    function onTick() {
      remaining -= 1;
      if (selectedTimerId) {
        timers = timers.map((timer) => timer.id === selectedTimerId ? { ...timer, remaining } : timer);
      }
      updateView();

      if (remaining <= 0) {
        stopTimer();
        remaining = 0;
        if (selectedTimerId) {
          timers = timers.map((timer) => timer.id === selectedTimerId ? { ...timer, remaining: 0 } : timer);
        }
        renderTimers();
        updateView();
        startAlarmLoop();
      }
    }

    resetBtn.addEventListener("click", () => {
      stopTimer();
      stopAlarmLoop();
      stopBackgroundAudio();
      remaining = toTotalSeconds(selectedDuration);
      if (selectedTimerId) {
        timers = timers.map((timer) => timer.id === selectedTimerId ? { ...timer, remaining: timer.totalSeconds } : timer);
      }
      renderTimers();
      updateView();
    });

    applyBtn.addEventListener("click", applyDuration);

    [hoursInput, minutesInput, secondsInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          applyDuration();
        }
      });
    });

    themeBtn.addEventListener("click", () => {
      isNight = !isNight;
      document.body.classList.toggle("night", isNight);
      themeIcon.textContent = isNight ? "☾" : "☀";
      themeBtn.setAttribute("aria-label", isNight ? "Switch to day mode" : "Switch to night mode");
      themeBtn.setAttribute("aria-pressed", String(isNight));
    });

    bgSoundSelect.addEventListener("change", () => {
      loadBackgroundTrack();
      if (alarmIntervalId) {
        setTimeout(() => {
          startBackgroundAudio();
        }, 700);
      }
    });

    volumeSlider.addEventListener("input", () => {
      setBackgroundVolume();
    });

    alarmDurationInput.addEventListener("change", syncAlarmDuration);

    alarmTabBtn.addEventListener("click", () => showTool("alarm"));
    stopwatchTabBtn.addEventListener("click", () => showTool("stopwatch"));
    timerTabBtn.addEventListener("click", () => showTool("timer"));
    addTimerBtn.addEventListener("click", addTimer);
    addClockAlarmBtn.addEventListener("click", addClockAlarm);
    setClockAlarmBtn.addEventListener("click", setClockAlarm);
    clearClockAlarmBtn.addEventListener("click", clearClockAlarm);
    startStopwatchBtn.addEventListener("click", startStopwatch);
    pauseStopwatchBtn.addEventListener("click", pauseStopwatch);
    resetStopwatchBtn.addEventListener("click", resetStopwatch);

    [clockHourInput, clockMinuteInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          setClockAlarm();
        }
      });
    });

    dingBtn.addEventListener("click", () => {
      unlockAudio();
      if (alarmIntervalId) {
        stopAlarmLoop();
        return;
      }
      startAlarmLoop();
    });

    startBtn.addEventListener("click", () => {
      unlockAudio();
      if (intervalId) {
        return;
      }
      if (!selectedTimerId) {
        addTimer();
      }
      stopAlarmLoop();
      if (remaining <= 0) {
        remaining = toTotalSeconds(selectedDuration);
      }
      intervalId = setInterval(onTick, 1000);
    });

    pauseBtn.addEventListener("click", () => {
      stopTimer();
      stopAlarmLoop();
      stopBackgroundAudio();
    });

    addTimer();
    renderAlarms();
    updateStopwatch();
    loadBackgroundTrack();
    clockCheckIntervalId = setInterval(checkClockAlarm, 1000);
    ringtoneSelect.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        playRingtone();
      }
    });
  </script>
</body>
</html>
